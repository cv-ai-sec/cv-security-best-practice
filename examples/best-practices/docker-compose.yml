# BEST PRACTICE
# - Secret comes from the host environment, not the file (D06)
# - Read-only root filesystem, no extra capabilities (D05, D09)
# - Memory and process limits (D07)
# - Its own network, only the port it needs (D03)
services:
  web:
    image: example/web:1.4.2
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      PAYMENTS_API_KEY: ${PAYMENTS_API_KEY}
    mem_limit: 512m
    pids_limit: 200
    networks: [app]
    ports:
      - "127.0.0.1:3000:3000"

networks:
  app:
    driver: bridge
